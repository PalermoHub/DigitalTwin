<html lang="it">
<head>
<meta charset="utf-8">

<meta property="og:image" content="https://palermohub.github.io/DigitalTwin/img/social_card.jpg">
<meta property="og:image:width" content="1200">

<link rel="stylesheet" href="css/vendor/maplibre-gl.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header id="app-header">
<a id="app-logo" href="./" title="Palermo Digital Twin" aria-label="Palermo Digital Twin, pagina iniziale"><img class="logo-chiaro" src="img/logo-palermo-digital-twin.svg" alt="Palermo Digital Twin" width="214" height="46"><img class="logo-scuro" src="img/logo-palermo-digital-twin-scuro.svg" alt="" width="214" height="46"></a>
<button id="menu-info-toggle" type="button" aria-expanded="false" aria-controls="menu-info" aria-label="Menu informazioni"><svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20" aria-hidden="true"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg></button>
<nav id="menu-info" aria-label="Informazioni">
  <button type="button" title="Digital Twin" data-scheda="mappa" aria-current="page">Mappa</button>
  <button type="button" title="Cos’è per noi un Digital Twin" data-scheda="digitaltwin">Digital Twin</button>
  <button type="button" title="Argomenti" data-scheda="argomenti">Argomenti</button>
  <button type="button" title="Guida generale della web app" data-scheda="guida">Guida</button>
  <button type="button" title="Plugin RNDT di Andrea Borruso e guida all'uso" data-scheda="plugin">Plugin RNDT</button>
  <button type="button" title="Guida per Geoimage" data-scheda="geoimage">Guida Geoimage</button>
  <button type="button" title="Fonti dei dati e avvisi" data-scheda="fonti">Fonti e avvisi</button>
  <button type="button" title="Chi siamo" data-scheda="about">About</button>
</nav>
</header>
<main id="corpo">
<div id="mappa"></div>

<div id="pannello" aria-label="Strati della mappa"></div>
<div id="legende-box"><button id="legende-riduci" type="button" aria-expanded="true">▾ Riduci</button><div id="legende"></div></div>

<nav id="barra-strati" aria-label="Strati della mappa">
  <h2 class="barra-titolo">Strati</h2>
  <div id="barra-gruppi" role="group" aria-label="Strati della mappa"></div>
  <button id="chiudi-strati" type="button">Fatto</button>
</nav>
<button id="apri-strati" type="button" aria-expanded="false" aria-controls="barra-strati"><svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18" aria-hidden="true"><path d="M11.99 18.54l-7.37-5.73L3 14.07l9 7 9-7-1.63-1.27-7.38 5.74zM12 16l7.36-5.73L21 9l-9-7-9 7 1.63 1.27L12 16z"/></svg><span class="lbl-strati">Strati · </span><span id="strati-attivi">0</span></button>

<div id="barra-strumenti" role="toolbar" aria-label="Strumenti mappa">
  <button id="btn-home" type="button" title="Vista iniziale" aria-label="Vista iniziale"><svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></button>
  <button id="btn-3d" type="button" title="Vista 3D" aria-label="Vista 3D" aria-pressed="false">3D</button>
  <button id="btn-rndt" type="button" title="Catalogo RNDT: aggiungi dati alla mappa" aria-label="Catalogo RNDT" aria-haspopup="dialog"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg></button>
  <button id="btn-fs" type="button" title="Schermo intero" aria-label="Schermo intero"><svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16" aria-hidden="true"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></button>
  <button id="btn-stampa" type="button" title="Stampa la mappa visualizzata" aria-label="Stampa la mappa visualizzata"><svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16" aria-hidden="true"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg></button>
  <button id="btn-tema" type="button" title="Tema scuro" aria-label="Tema scuro" aria-pressed="false"><svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg></button>
</div>

<div id="stampa-menu" role="group" aria-label="Opzioni di stampa" hidden><label for="stampa-formato">Formato</label><select id="stampa-formato"></select><select id="stampa-direzione" aria-label="Orientamento"></select><label for="stampa-scala">Scala</label><select id="stampa-scala"></select><button id="stampa-vai" type="button">Stampa</button></div>

<div id="zoom-box" role="group" aria-label="Zoom"><div id="zoom-badge" aria-live="off">12</div><div class="zoom-wrap"><input type="range" id="zoom-slider" min="12" max="18" step="0.1" value="12" aria-label="Zoom"></div></div>

<div id="strati-chip" role="group" aria-label="Strati accesi"></div>

<div id="area-ricerca">
  <div id="avvisi" role="status"></div>
  <div id="filtri-chips" hidden></div>
  <div id="filtri-linea-chips" hidden></div>
  <div id="filtri-incidenti-chips" hidden></div>
  <p id="cerca-particella-esito" hidden></p>
  <div id="pannello-filtri" hidden>
    <h2>Zona</h2>
    <label>Circoscrizione <select id="f-circ" aria-label="Circoscrizione"></select></label>
    <label>Quartiere <select id="f-quart" aria-label="Quartiere"></select></label>
    <label>UPL <select id="f-upl" aria-label="UPL"></select></label>
    <h2>Trasporto pubblico</h2>
    <label>Linea <select id="f-linea" aria-label="Linea"></select></label>
    <h2>Incidenti</h2>
    <label>Anno <select id="sicurezza-anno" aria-label="Anno degli incidenti"></select></label>
    <label>Gravità <select id="sicurezza-gravita" aria-label="Gravità degli incidenti"></select></label>
    <h2>Catasto</h2>
    <div id="cerca-particella">
      <input id="cerca-foglio" type="number" min="1" placeholder="Foglio" aria-label="Foglio catastale">
      <input id="cerca-numero" type="number" min="1" placeholder="Particella" aria-label="Particella catastale">
      <button id="cerca-particella-vai" type="button">Cerca particella</button>
    </div>
  </div>
  <form id="cerca" role="search" autocomplete="off">
    <span class="cerca-icona"><svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></span>
    <input id="cerca-testo" type="search" placeholder="Cerca via, civico, quartiere o particella…" aria-label="Cerca indirizzo o particella">
    <span class="cerca-sep"></span>
    <button id="cerca-ripristina" type="button" title="Ripristina colori, schede e ordine degli strati" aria-label="Ripristina personalizzazioni"><svg viewBox="0 0 24 24" fill="currentColor" width="15" height="15" aria-hidden="true"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg></button>
    <button id="cerca-filtri" type="button" title="Filtri: zona e catasto" aria-label="Filtri: zona e catasto" aria-expanded="false"><svg viewBox="0 0 24 24" fill="currentColor" width="15" height="15" aria-hidden="true"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg><span class="cerca-et">Filtri</span></button>
    <ul id="cerca-risultati" hidden></ul>
  </form>
</div>

<aside id="scheda" hidden aria-label="Scheda del luogo"></aside>
<aside id="rndt-pannello" hidden aria-label="Catalogo RNDT"></aside>
<aside id="geoimage-pannello" hidden aria-label="Geoimage: mappe storiche"></aside>
<nav id="rail-pannelli" aria-label="Pannelli laterali"></nav>
<dialog id="crediti" aria-label="Informazioni"></dialog>
</main>

<p class="piede-avviso">Catasto, PRG e vincoli sono dati informativi, <strong>senza valore legale</strong>.</p>
<span id="piede-coord" aria-hidden="true"></span>
<a id="logo-ods" href="https://opendatasicilia.it/" title="Open Data Sicilia" target="_blank" rel="noopener"><img src="img/opendatasicilia.png" alt="Open Data Sicilia" width="21" height="24"></a>
</footer>

<script defer src="js/vendor/maplibre-gl.js"></script>
<script defer src="js/vendor/pmtiles.js"></script>

</body>
</html>
