<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digital Twin Palermo</title>
<meta name="description" content="Mappa interattiva di Palermo: catasto, PRG, popolazione, edifici, rilievo e trasporto pubblico, con schede del luogo da dati aperti.">
<meta name="theme-color" content="#ffffff">
<meta property="og:type" content="website">
<meta property="og:title" content="Digital Twin Palermo">
<meta property="og:description" content="Catasto, PRG, popolazione, edifici, rilievo e trasporto pubblico di Palermo su una sola mappa, da dati aperti.">
<link rel="icon" href="img/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="stylesheet" href="css/vendor/maplibre-gl.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="mappa"></div>

<div id="pannello" aria-label="Strati della mappa"></div>
<div id="legende-box"><button id="legende-riduci" type="button" aria-expanded="true">▾ Riduci</button><div id="legende"></div></div>
<p class="avviso-fisso">Catasto, PRG e vincoli sono dati informativi, <strong>senza valore legale</strong>.</p>

<nav id="barra-strati" aria-label="Strati della mappa">
  <h2 class="barra-titolo">Strati</h2>
  <div id="barra-gruppi" role="group" aria-label="Strati della mappa"></div>
  <button id="chiudi-strati" type="button">Fatto</button>
</nav>
<button id="apri-strati" type="button" aria-expanded="false" aria-controls="barra-strati"><svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18" aria-hidden="true"><path d="M11.99 18.54l-7.37-5.73L3 14.07l9 7 9-7-1.63-1.27-7.38 5.74zM12 16l7.36-5.73L21 9l-9-7-9 7 1.63 1.27L12 16z"/></svg>Strati · <span id="strati-attivi">0</span></button>

<div id="barra-strumenti" role="toolbar" aria-label="Strumenti mappa">
  <button id="btn-home" type="button" title="Vista iniziale" aria-label="Vista iniziale"><svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></button>
  <button id="btn-3d" type="button" title="Vista 3D" aria-label="Vista 3D" aria-pressed="false">3D</button>
  <button id="btn-rndt" type="button" title="Catalogo RNDT: aggiungi dati alla mappa" aria-label="Catalogo RNDT" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16" aria-hidden="true"><path d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg></button>
  <button id="btn-fs" type="button" title="Schermo intero" aria-label="Schermo intero"><svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16" aria-hidden="true"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></button>
  <button id="apri-crediti" type="button" title="Informazioni, fonti e avvisi" aria-label="Informazioni, fonti e avvisi" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16" aria-hidden="true"><path d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg></button>
</div>
<div id="zoom-box" role="group" aria-label="Zoom"><div id="zoom-badge" aria-live="off">12</div><div class="zoom-wrap"><input type="range" id="zoom-slider" min="12" max="18" step="0.1" value="12" aria-label="Zoom"></div></div>

<div id="strati-chip" role="list" aria-label="Strati accesi"></div>

<div id="area-ricerca">
  <div id="avvisi" role="status"></div>
  <div id="filtri-chips" hidden></div>
  <div id="filtri-linea-chips" hidden></div>
  <div id="filtri-incidenti-chips" hidden></div>
  <p id="cerca-particella-esito" hidden></p>
  <div id="pannello-filtri" hidden>
    <h2>Filtri geografici</h2>
    <label>Circoscrizione <select id="f-circ" aria-label="Circoscrizione"></select></label>
    <label>Quartiere <select id="f-quart" aria-label="Quartiere"></select></label>
    <label>UPL <select id="f-upl" aria-label="UPL"></select></label>
    <h2>Trasporto pubblico</h2>
    <label>Linea <select id="f-linea" aria-label="Linea"></select></label>
    <h2>Incidenti</h2>
    <label>Anno <select id="sicurezza-anno" aria-label="Anno degli incidenti"></select></label>
    <label>Gravità <select id="sicurezza-gravita" aria-label="Gravità degli incidenti"></select></label>
    <h2>Catasto</h2>
    <div id="cerca-particella">
      <input id="cerca-foglio" type="number" min="1" placeholder="Foglio" aria-label="Foglio catastale">
      <input id="cerca-numero" type="number" min="1" placeholder="Particella" aria-label="Particella catastale">
      <button id="cerca-particella-vai" type="button">Cerca particella</button>
    </div>
  </div>
  <form id="cerca" role="search" autocomplete="off">
    <span class="cerca-icona"><svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></span>
    <input id="cerca-testo" type="search" placeholder="Cerca via, civico, quartiere o particella…" aria-label="Cerca indirizzo o particella">
    <span class="cerca-sep"></span>
    <button id="cerca-filtri" type="button" title="Filtri: zona e catasto" aria-label="Filtri: zona e catasto" aria-expanded="false"><svg viewBox="0 0 24 24" fill="currentColor" width="15" height="15" aria-hidden="true"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg></button>
    <ul id="cerca-risultati" hidden></ul>
  </form>
</div>

<aside id="scheda" hidden aria-label="Scheda del luogo"></aside>
<aside id="rndt-pannello" hidden aria-label="Catalogo RNDT"></aside>
<nav id="rail-pannelli" aria-label="Pannelli laterali"></nav>
<a id="logo-ods" href="https://opendatasicilia.it/" title="Open Data Sicilia" target="_blank" rel="noopener"><img src="img/opendatasicilia.png" alt="Open Data Sicilia" width="60" height="69"></a>
<button id="linguetta-info" type="button" title="Apri informazioni" aria-label="Apri informazioni"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M7.41 15.41 12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg></button>
<dialog id="crediti" aria-label="Informazioni"></dialog>

<script src="js/vendor/maplibre-gl.js"></script>
<script src="js/vendor/pmtiles.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
