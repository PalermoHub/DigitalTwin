<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'Montserrat'; font-weight: 600; src: url('../../css/fonts/montserrat-SemiBold.woff2') format('woff2'); }
@font-face { font-family: 'Montserrat'; font-weight: 700; src: url('../../css/fonts/montserrat-Bold.woff2') format('woff2'); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1900px; height: 400px; overflow: hidden; background: #0e121a; }
body { font-family: 'Montserrat', sans-serif; color: #fff; position: relative; }
.l { position: absolute; }
/* sfondo: la mappa vera, scurita, con bagliore arancio (come nel reel) */
#mappa { inset: 0; overflow: hidden; }
#mappa img { position: absolute; width: 2600px; left: -300px; top: -700px; filter: blur(2px) brightness(.75) saturate(1.15); }
#velo { inset: 0; background:
  linear-gradient(90deg, rgba(14,18,26,.92) 0%, rgba(14,18,26,.78) 38%, rgba(14,18,26,.35) 70%, rgba(14,18,26,.55) 100%),
  radial-gradient(ellipse 35% 80% at 70% 50%, rgba(245,166,35,.22), transparent 70%), radial-gradient(ellipse 60% 70% at 25% 120%, rgba(245,166,35,.30), transparent 70%); }
/* testo: tutto nella fascia y 300–720, che lo slider mostra anche su schermi stretti */
.testo { left: 380px; top: 34px; width: 760px; }
.logo { height: 58px; display: block; }
.etich { margin-top: 16px; display: flex; align-items: center; gap: 14px; font-weight: 600; font-size: 26px; letter-spacing: .02em; }
.badge { width: 40px; height: 40px; border-radius: 9px; background: #fff; display: grid; place-items: center; }
.box { display: inline-block; margin-top: 14px; background: #f5a623; color: #1a1206; font-weight: 700; text-transform: uppercase;
  font-size: 66px; line-height: 1; padding: 14px 24px 16px; border-radius: 12px; box-shadow: 0 18px 50px rgba(245,166,35,.25); white-space: nowrap; }
.sotto { margin-top: 18px; white-space: nowrap; font-weight: 600; font-size: 26px; line-height: 1.25; color: #e8ebf0; }
.scena { inset: 0; perspective: 2200px; }
.shot { position: absolute; border-radius: 16px; overflow: hidden; background: #fff;
  box-shadow: 0 40px 90px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.1); }
.shot img { display: block; width: 100%; height: 100%; object-fit: cover; }
.a { left: 1080px; top: 30px; width: 560px; height: 315px; transform: rotateY(-22deg) rotateX(5deg) rotateZ(3deg); }
.b { left: 1500px; top: 70px; width: 520px; height: 293px; transform: rotateY(-18deg) rotateX(7deg) rotateZ(3deg); }
.c { left: 1430px; top: 120px; width: 330px; height: 330px; border-radius: 26px; transform: rotateY(-16deg) rotateZ(5deg); }
</style>
</head>
<body>
<div class="l" id="mappa"><img src="../../img/landing/hero-scuro.webp" alt=""></div>
<div class="l" id="velo"></div>
<div class="l scena">
  <div class="shot b"><img src="../../img/guida/passi/mappe-storiche.webp" alt=""></div>
  <div class="shot a"><img src="../../img/landing/hero-scuro.webp" style="object-position: top" alt=""></div>
</div>
<div class="l testo">
  <img class="logo" src="../../img/logo-palermo-digital-twin-scuro.svg" alt="">
  <div class="etich"><span class="badge"><svg viewBox="0 0 100 100" width="24" height="24"><polygon points="50,6 88,28 88,72 50,94 12,72 12,28" fill="#f5a623" stroke="#0e121a" stroke-width="10" stroke-linejoin="round"/></svg></span>ORA È ONLINE</div>
  <div class="box">Digital Twin</div>
  <p class="sotto">Il gemello digitale di Palermo, con i dati aperti</p>
</div>
</body>
</html>
