<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'Montserrat'; font-weight: 500; src: url('../../css/fonts/montserrat-Medium.woff2') format('woff2'); }
@font-face { font-family: 'Montserrat'; font-weight: 600; src: url('../../css/fonts/montserrat-SemiBold.woff2') format('woff2'); }
@font-face { font-family: 'Montserrat'; font-weight: 700; src: url('../../css/fonts/montserrat-Bold.woff2') format('woff2'); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body {
  font-family: 'Montserrat', sans-serif; color: #fff; position: relative;
  background:
    radial-gradient(ellipse 60% 70% at 78% 55%, rgba(245,166,35,.10), transparent 70%),
    radial-gradient(ellipse 50% 60% at 10% 0%, rgba(255,255,255,.04), transparent 70%),
    #0e121a;
}
.testo { position: absolute; left: 64px; top: 56px; bottom: 52px; width: 560px; display: flex; flex-direction: column; z-index: 2; }
.logo { height: 70px; width: auto; align-self: flex-start; }
.etichetta { margin-top: auto; display: flex; align-items: center; gap: 16px; font-weight: 600; font-size: 28px; letter-spacing: .01em; }
.numero { width: 44px; height: 44px; border-radius: 9px; background: #fff; color: #0e121a; font-weight: 700; font-size: 28px; display: grid; place-items: center; }
.titolo { margin-top: 22px; align-self: flex-start; background: #f5a623; color: #1a1206; font-weight: 700; text-transform: uppercase;
  font-size: var(--t, 84px); line-height: 1; letter-spacing: -.01em; padding: 18px 30px 20px; border-radius: 14px;
  box-shadow: 0 14px 40px rgba(245,166,35,.22); white-space: nowrap; line-height: var(--lh, 1); }
.sotto { margin-top: 30px; font-weight: 600; font-size: 38px; line-height: 1.22; }
.firma { margin-top: auto; display: flex; align-items: center; gap: 14px; font-weight: 500; font-size: 24px; color: #e6e8ec; }
.firma img { height: 46px; filter: invert(1); }
.firma span { white-space: nowrap; line-height: var(--lh, 1); }
.firma .url { margin-left: auto; color: #8a93a3; font-size: 18px; }
.scena { position: absolute; inset: 0; perspective: 1600px; z-index: 1; }
.shot { position: absolute; border-radius: 12px; overflow: hidden; background: #fff;
  box-shadow: 0 30px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08); transform-style: preserve-3d; }
.shot img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: var(--pos, center); }
.a { left: 640px; top: 96px; width: 720px; height: 405px; transform: rotateY(-24deg) rotateX(6deg) rotateZ(4deg); }
.b { left: 700px; top: 410px; width: 640px; height: 360px; transform: rotateY(-20deg) rotateX(8deg) rotateZ(4deg); }
</style>
</head>
<body>
<div class="scena">
  <div class="shot b"><img id="b" alt=""></div>
  <div class="shot a"><img id="a" alt=""></div>
</div>
<div class="testo">
  <img class="logo" src="../../img/logo-palermo-digital-twin-scuro.svg" alt="">
  <div class="etichetta"><span class="numero" id="n"></span><span id="etichetta"></span></div>
  <div class="titolo" id="titolo"></div>
  <p class="sotto" id="sotto"></p>
  <div class="firma"><img src="../../img/opendatasicilia.png" alt=""><span>Open Data Sicilia</span><span class="url">palermodigitaltwin.opendatasicilia.it</span></div>
</div>
<script>
const p = new URLSearchParams(location.search);
if (p.get('n')) n.textContent = p.get('n'); else n.innerHTML = '<svg viewBox="0 0 100 100" width="28" height="28"><polygon points="50,6 88,28 88,72 50,94 12,72 12,28" fill="#f5a623" stroke="#0e121a" stroke-width="10" stroke-linejoin="round"/></svg>'; etichetta.textContent = p.get('etichetta') || 'SCOPRI LA MAPPA';
titolo.innerHTML = p.get('titolo'); sotto.innerHTML = p.get('sotto');
if (p.get('lh')) titolo.style.setProperty('--lh', p.get('lh'));
if (p.get('t')) titolo.style.setProperty('--t', p.get('t') + 'px');
a.src = '../../img/' + p.get('a'); b.src = '../../img/' + p.get('b');
if (p.get('pa')) a.style.setProperty('--pos', p.get('pa'));
if (p.get('pb')) b.style.setProperty('--pos', p.get('pb'));
</script>
</body>
</html>
