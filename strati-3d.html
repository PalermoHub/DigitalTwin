<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strati 3D · Palermo Digital Twin</title>
<meta name="description" content="Gli strati del Digital Twin di Palermo esplosi in 3D: girali attorno, avvicinati, esplora ogni dato.">
<link rel="icon" href="img/favicon.ico" sizes="any">
<!-- Versione interattiva del reel «strati esplosi» (scripts/social/esplodi.html): stesse texture, catturate dall'app
     con scripts/social/strati-cattura.mjs e terreno-gradoni.py. Trascina per girare, rotella o pizzico per lo zoom. -->
<style>
@font-face { font-family: 'Montserrat'; font-weight: 500; font-display: swap; src: url('css/fonts/montserrat-Medium.woff2') format('woff2'); }
@font-face { font-family: 'Montserrat'; font-weight: 600; font-display: swap; src: url('css/fonts/montserrat-SemiBold.woff2') format('woff2'); }
@font-face { font-family: 'Montserrat'; font-weight: 700; font-display: swap; src: url('css/fonts/montserrat-Bold.woff2') format('woff2'); }
:root { --sfondo: #0e121a; --ambra: #f5a623; --testo: #fff; --tenue: #aab2c0; --pannello: rgba(16,20,29,.9); --bordo: rgba(255,255,255,.12); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--sfondo); color: var(--testo); font-family: 'Montserrat', system-ui, sans-serif; }
body { position: relative; touch-action: none; user-select: none; -webkit-user-select: none; }
#sfondo { position: fixed; inset: 0; background:
  radial-gradient(ellipse 70% 50% at 50% 55%, rgba(245,166,35,.13), transparent 70%),
  radial-gradient(circle, rgba(255,255,255,.07) 1.4px, transparent 1.8px) 0 0 / 44px 44px, var(--sfondo); }
#palco { position: fixed; inset: 0; perspective: 2600px; overflow: hidden; cursor: grab; }
#palco.trascina { cursor: grabbing; }
#mondo { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; }
.piano { position: absolute; left: -500px; top: -500px; width: 1000px; height: 1000px; transform-style: preserve-3d;
  border: 3px solid rgba(255,255,255,.35); border-radius: 4px; transition: opacity .25s; }
.piano img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
.piano.att { border-color: var(--ambra); box-shadow: 0 0 60px rgba(245,166,35,.55), inset 0 0 0 2px var(--ambra); }
#linee { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }

header { position: fixed; left: 20px; top: 18px; right: 20px; display: flex; align-items: center; gap: 14px; pointer-events: none; }
header img { height: 44px; }
header .titolo { font-weight: 700; text-transform: uppercase; font-size: 15px; letter-spacing: .04em; }
header .titolo span { display: inline-block; background: var(--ambra); color: #1a1206; padding: 3px 8px 4px; border-radius: 5px; margin-left: 4px; }
header a { pointer-events: auto; margin-left: auto; color: var(--testo); text-decoration: none; font-weight: 600; font-size: 14px;
  border: 1px solid var(--bordo); background: var(--pannello); padding: 9px 14px; border-radius: 999px; }
header a:hover, header a:focus-visible { border-color: var(--ambra); }

#elenco { position: fixed; right: 16px; top: 50%; transform: translateY(-50%); width: 230px; max-height: calc(100% - 200px); overflow: auto;
  background: var(--pannello); border: 1px solid var(--bordo); border-radius: 14px; padding: 8px; backdrop-filter: blur(8px); }
#elenco button { display: flex; width: 100%; align-items: center; gap: 10px; background: none; border: 0; color: var(--testo); font: inherit;
  text-align: left; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
#elenco button:hover, #elenco button:focus-visible { background: rgba(255,255,255,.07); outline: none; }
#elenco button.att { background: rgba(245,166,35,.16); }
#elenco b { display: block; font-size: 14px; font-weight: 700; }
#elenco small { display: block; font-size: 11.5px; color: var(--tenue); font-weight: 500; }
#elenco i { flex: none; width: 22px; height: 22px; border-radius: 6px; border: 2px solid rgba(255,255,255,.4); display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 700; color: var(--tenue); }
#elenco button.att i { border-color: var(--ambra); color: var(--ambra); }

#comandi { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; align-items: center; gap: 14px;
  background: var(--pannello); border: 1px solid var(--bordo); border-radius: 999px; padding: 10px 18px; backdrop-filter: blur(8px); white-space: nowrap; }
#comandi label { font-size: 13px; font-weight: 600; color: var(--tenue); display: flex; align-items: center; gap: 10px; }
#comandi input[type=range] { width: 160px; accent-color: var(--ambra); }
#comandi button { background: none; border: 1px solid var(--bordo); color: var(--testo); font: 600 13px 'Montserrat', sans-serif; padding: 7px 12px; border-radius: 999px; cursor: pointer; }
#comandi button:hover, #comandi button:focus-visible, #comandi button[aria-pressed=true] { border-color: var(--ambra); color: var(--ambra); }
#aiuto { position: fixed; left: 20px; bottom: 86px; font-size: 12px; color: var(--tenue); max-width: 260px; line-height: 1.4; pointer-events: none; transition: opacity .6s; }

@media (max-width: 760px) {
  header img { height: 34px; } header .titolo { display: none; }
  #elenco { top: auto; bottom: 78px; right: 8px; left: 8px; transform: none; width: auto; max-height: 132px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 6px; }
  #elenco button { padding: 5px 6px; } #elenco small { display: none; } #elenco b { font-size: 12.5px; }
  #comandi { left: 8px; right: 8px; transform: none; justify-content: space-between; padding: 8px 12px; gap: 8px; }
  #comandi input[type=range] { width: 110px; }
  #aiuto { display: none; }
}
@media (prefers-reduced-motion: reduce) { .piano { transition: none; } }
</style>
</head>
<body>
<div id="sfondo"></div>
<div id="palco" aria-label="Strati della mappa in 3D: trascina per girare, rotella per lo zoom"><div id="mondo"></div></div>
<svg id="linee" aria-hidden="true"></svg>
<header>
  <img src="img/logo-palermo-digital-twin-scuro.svg" alt="Palermo Digital Twin">
  <div class="titolo">Strati <span>in 3D</span></div>
  <a href="index.html">Apri la mappa</a>
</header>
<nav id="elenco" aria-label="Strati"></nav>
<div id="comandi">
  <label>Esplodi <input type="range" id="esplodi" min="0" max="1.6" step="0.01" value="1"></label>
  <button id="gira" type="button" aria-pressed="true">Gira</button>
  <button id="vista" type="button">Dall'alto</button>
</div>
<p id="aiuto">Trascina per girare attorno agli strati, usa la rotella (o due dita) per avvicinarti, tocca uno strato nell'elenco per metterlo in evidenza.</p>

<script>
const $ = id => document.getElementById(id);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, x) => a + (b - a) * x;
const GAP = 75, SPAZIO_TERRENO = 50, QUOTA = .15, FETTE = 6, P = 2600;
const DIR = 'img/social/strati/';
const fermo = matchMedia('(prefers-reduced-motion: reduce)').matches;

// stato della camera: obiettivo (dove va) e corrente (dove è), così ogni gesto arriva morbido
const meta = { a: 30, b: 58, z: .78, e: 1, zt: null, att: -1 };
const cam = { ...meta };
let STRATI = [], BASE_Z = [], gira = !fermo, ultimoGesto = 0;

async function carica() {
  const conf = await (await fetch('scripts/social/strati.json')).json();
  STRATI = conf.strati;
  const gradoni = await (await fetch(DIR + 'terreno.json')).json().catch(() => []);
  BASE_Z = STRATI.map((_, i) => STRATI.slice(0, i).reduce((z, s) => z + GAP + (s.gradoni ? SPAZIO_TERRENO : 0), 0));
  const mondo = $('mondo'), elenco = $('elenco');
  STRATI.forEach((s, i) => {
    const el = document.createElement('div'); el.className = 'piano'; el.id = 'pi' + i;
    const img = src => { const f = document.createElement('img'); f.src = DIR + src; f.alt = ''; f.decoding = 'async'; el.append(f); return f; };
    if (s.gradoni) for (const g of gradoni) img(g.file).dataset.q = g.quota;
    else {
      if (s.id === 'edifici') for (let j = 0; j < FETTE; j++) { const f = img(s.id + '.webp'); f.dataset.j = j; f.style.filter = `brightness(${.35 + .5 * j / FETTE}) saturate(.6)`; }
      img(s.id + '.webp');
    }
    mondo.append(el);
    const b = document.createElement('button'); b.type = 'button'; b.id = 'bt' + i;
    b.innerHTML = `<i>${i + 1}</i><span><b>${s.titolo}</b><small>${s.sotto}</small></span>`;
    b.addEventListener('click', () => { meta.att = meta.att === i ? -1 : i; meta.zt = meta.att < 0 ? null : BASE_Z[i]; gesto(); });
    elenco.prepend(b);                       // in cima l'ultimo strato, come nella pila
    const ln = document.createElementNS('http://www.w3.org/2000/svg', 'path'); ln.id = 'ln' + i;
    ln.setAttribute('stroke', '#f5a623'); ln.setAttribute('stroke-width', '2'); ln.setAttribute('stroke-dasharray', '7 6'); ln.setAttribute('fill', 'none');
    $('linee').append(ln);
  });
  requestAnimationFrame(passo);
}

function gesto() { ultimoGesto = performance.now(); setTimeout(() => $('aiuto').style.opacity = 0, 1500); }

// ── interazione ──
const palco = $('palco'), puntatori = new Map();
let distanza0 = 0, zoom0 = 1;
palco.addEventListener('pointerdown', ev => { palco.setPointerCapture(ev.pointerId); puntatori.set(ev.pointerId, [ev.clientX, ev.clientY]); palco.classList.add('trascina'); gesto();
  if (puntatori.size === 2) { const [p1, p2] = [...puntatori.values()]; distanza0 = Math.hypot(p1[0] - p2[0], p1[1] - p2[1]); zoom0 = meta.z; } });
palco.addEventListener('pointermove', ev => {
  if (!puntatori.has(ev.pointerId)) return;
  const [x0, y0] = puntatori.get(ev.pointerId); puntatori.set(ev.pointerId, [ev.clientX, ev.clientY]);
  if (puntatori.size === 1) { meta.a -= (ev.clientX - x0) * .35; meta.b = cl(meta.b - (ev.clientY - y0) * .25, 0, 82); }
  else if (puntatori.size === 2) { const [p1, p2] = [...puntatori.values()]; meta.z = cl(zoom0 * Math.hypot(p1[0] - p2[0], p1[1] - p2[1]) / distanza0, .45, 3.5); }
  gesto();
});
const fine = ev => { puntatori.delete(ev.pointerId); if (!puntatori.size) palco.classList.remove('trascina'); };
palco.addEventListener('pointerup', fine); palco.addEventListener('pointercancel', fine);
palco.addEventListener('wheel', ev => { ev.preventDefault(); meta.z = cl(meta.z * Math.exp(-ev.deltaY * .0015), .45, 3.5); gesto(); }, { passive: false });
addEventListener('keydown', ev => {
  const k = { ArrowLeft: () => meta.a += 10, ArrowRight: () => meta.a -= 10, ArrowUp: () => meta.b = cl(meta.b + 6, 0, 82), ArrowDown: () => meta.b = cl(meta.b - 6, 0, 82),
    '+': () => meta.z = cl(meta.z * 1.15, .45, 3.5), '-': () => meta.z = cl(meta.z / 1.15, .45, 3.5) }[ev.key];
  if (k && !(ev.target instanceof HTMLInputElement)) { k(); gesto(); }
});
$('esplodi').addEventListener('input', ev => { meta.e = +ev.target.value; gesto(); });
$('gira').addEventListener('click', ev => { gira = !gira; ev.currentTarget.setAttribute('aria-pressed', gira); });
$('vista').addEventListener('click', ev => {
  const alto = meta.b > 5; meta.b = alto ? 0 : 58; if (alto) meta.a = Math.round(meta.a / 360) * 360;
  ev.currentTarget.textContent = alto ? 'In 3D' : "Dall'alto"; if (alto) { gira = false; $('gira').setAttribute('aria-pressed', false); } gesto();
});

// ── disegno ──
let tPrima = performance.now();
function passo(ora) {
  const dt = Math.min(.05, (ora - tPrima) / 1000); tPrima = ora;
  if (gira && ora - ultimoGesto > 2500) meta.a += dt * 9;
  const m = 1 - Math.exp(-dt * 7);
  for (const k of ['a', 'b', 'z', 'e']) cam[k] = lerp(cam[k], meta[k], m);
  const zt = meta.zt ?? BASE_Z.at(-1) * meta.e / 2;
  cam.zt = cam.zt == null ? zt : lerp(cam.zt, zt, m);
  const W = innerWidth, H = innerHeight, stretto = W < 760;
  const k = Math.min(W, H) / 1000 * (stretto ? .85 : .6) * cam.z;
  const py = stretto ? -40 : 30, px = stretto ? 0 : -80;
  const tr = `translate(${px}px,${py}px) scale3d(${k},${k},${k}) rotateX(${cam.b}deg) rotateZ(${cam.a}deg) translateZ(${-cam.zt}px)`;
  $('mondo').style.transform = tr;
  const M = new DOMMatrix(tr);
  STRATI.forEach((s, i) => {
    const el = $('pi' + i), z = BASE_Z[i] * cam.e + i * .4 + (i === meta.att ? 25 : 0);
    el.style.transform = `translateZ(${z}px)`;
    el.style.opacity = meta.att < 0 || i === meta.att ? 1 : i < meta.att ? .25 : .1;
    el.style.background = s.base ? '' : `rgba(20,26,38,${.32 * cl(cam.e * 1.5)})`;
    el.classList.toggle('att', i === meta.att);
    $('bt' + i).classList.toggle('att', i === meta.att);
    if (s.gradoni) el.querySelectorAll('img').forEach(f => { f.style.transform = `translateZ(${+f.dataset.q * QUOTA * cl(cam.e * 1.3)}px)`; });
    if (s.id === 'edifici') el.querySelectorAll('img[data-j]').forEach(f => { f.style.transform = `translateZ(${(+f.dataset.j - FETTE) * 3 * cl(cam.e * 1.2 + .3)}px)`; });
    // linea dallo strato evidenziato verso l'elenco
    const ln = $('ln' + i);
    if (i === meta.att && !stretto) {
      const ang = [[-500, -500], [500, -500], [500, 500], [-500, 500]].map(([x, y]) => {
        const q = M.transformPoint(new DOMPoint(x, y, z)), w = 1 - q.z / P; return [W / 2 + q.x / w, H / 2 + q.y / w];
      });
      const [x, y] = ang.reduce((a, q) => q[0] > a[0] ? q : a), r = $('bt' + i).getBoundingClientRect();
      ln.setAttribute('d', `M${x},${y} L${r.left - 30},${y} L${r.left - 4},${r.top + r.height / 2}`); ln.style.opacity = 1;
    } else ln.style.opacity = 0;
  });
  requestAnimationFrame(passo);
}
carica();
</script>
</body>
</html>
