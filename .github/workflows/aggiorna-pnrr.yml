name: Aggiorna PNRR

# Avvio manuale: scarica dal catalogo open data di Italia Domani i file di localizzazione e dei progetti del PNRR (circa 330 MB),
# tiene i progetti localizzati nella sola città di Palermo, li posiziona dagli indirizzi con i civici già nel repository
# (dati/civici-omi/) e rigenera dati/pnrr/. Le regole sono nell'intestazione di scripts/pnrr.py.
on:
  workflow_dispatch:
    inputs:
      committa:
        description: "Salva i dati aggiornati nel repository (altrimenti solo artefatto scaricabile)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: aggiorna-pnrr
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # in locale servono circa 10 secondi, più lo scarico dei file
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Diagnosi: dice nella pagina di riepilogo (annotazioni) se il sito risponde ai server di GitHub, senza dover aprire i log
      - name: Diagnosi dello scarico
        continue-on-error: true
        run: |
          prova() {
            esito=$(curl -s -o /dev/null -r 0-99 -m 60 -w "HTTP %{http_code} da %{remote_ip}" -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36" -e "https://www.italiadomani.gov.it/content/sogei-ng/it/it/catalogo-open-data.html" "$2" || echo "curl fallito (codice $?)")
            echo "::notice title=$1::$esito"
          }
          prova "Italia Domani (localizzazione)" "https://www.italiadomani.gov.it/content/dam/sogei-ng/opendata/PNRR_Localizzazione.csv"
          prova "IPA (elenco amministrazioni)" "https://indicepa.gov.it/ipa-dati/dataset/502ff370-1b2c-4310-94c7-f39ceb7500e3/resource/3ed63523-ff9c-41f6-a6fe-980f3d9e501f/download/amministrazioni.txt"

      - name: Scarica i CSV e genera i dati di Palermo
        run: |
          # l'errore dello script finisce anche tra le annotazioni, così si legge senza aprire i log
          set +e
          python3 scripts/pnrr.py --cache "$RUNNER_TEMP/pnrr" 2> "$RUNNER_TEMP/errore.txt"
          codice=$?
          cat "$RUNNER_TEMP/errore.txt" >&2
          if [ "$codice" -ne 0 ]; then
            echo "::error title=Scarico PNRR fallito::$(tail -n 4 "$RUNNER_TEMP/errore.txt" | tr '\n' ' ')"
          fi
          exit "$codice"

      - name: Riepilogo
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("dati/pnrr/riepilogo.json"))
          print(f"## Progetti PNRR a Palermo — dati estratti il {r['estrazione']}")
          print(f"- Progetti localizzati solo a Palermo: {r['cup']}  ·  sulla mappa: {r['su_mappa']}")
          print(f"- Posizione: civico {r.get('posizione_civico', 0)}, solo la via {r.get('posizione_via', 0)}, indirizzo non trovato {r.get('indirizzo_non_trovato', 0)}, senza indirizzo {r.get('senza_indirizzo', 0)}")
          print(f"- Senza dati del progetto: {r.get('senza_dati_progetto', 0)}  ·  file dei progetti non scaricati: {r['file_progetti_mancanti'] or 'nessuno'}")
          print(f"- Per missione: {r['per_missione']}  ·  per stato: {r['per_stato']}")
          PY

      - name: Artefatto
        uses: actions/upload-artifact@v4
        with:
          name: dati-pnrr
          path: |
            dati/pnrr/pnrr.geojson
            dati/pnrr/pnrr_palermo.csv
            dati/pnrr/sintesi.json
            dati/pnrr/soggetti.json
            dati/pnrr/riepilogo.json
            dati/pnrr/README.md

      - name: Salva nel repository
        if: ${{ inputs.committa }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dati/pnrr/pnrr.geojson dati/pnrr/pnrr_palermo.csv dati/pnrr/sintesi.json dati/pnrr/soggetti.json dati/pnrr/riepilogo.json dati/pnrr/README.md
          if git diff --cached --quiet; then
            echo "Nessuna variazione nei dati."
          else
            git commit -m "dati: aggiornamento progetti PNRR a Palermo ($(date -u +%F))"
            git push
          fi
