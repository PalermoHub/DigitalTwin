name: Pubblica sito

# Pubblica il sito su GitHub Pages: ad ogni push su main, dopo gli aggiornamenti automatici dei dati (i loro push non fanno partire
# altri workflow) e a mano (Actions → «Pubblica sito» → Run workflow), per quando il deploy automatico di GitHub non parte.
#
# Richiede Settings → Pages → Build and deployment → Source: «GitHub Actions». Finché la sorgente è «Deploy from a branch» questo
# workflow non pubblica (lo scrive nel log) e resta in uso il deploy integrato di GitHub («pages build and deployment»).
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Aggiorna colonnine", "Aggiorna GTFS", "Aggiorna incendi", "Aggiorna MEF", "Aggiorna PAI", "Aggiorna uffici"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pubblica-sito
  cancel-in-progress: false

jobs:
  pubblica:
    # un aggiornamento dei dati andato male non pubblica nulla
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Controlla se c'è da pubblicare
        id: controllo
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENTO: ${{ github.event_name }}
        run: |
          tipo=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/pages" | python3 -c "import json,sys; print(json.load(sys.stdin).get('build_type',''))")
          echo "Sorgente di Pages: ${tipo:-sconosciuta}"
          if [ "$tipo" != "workflow" ]; then
            echo "::notice::La sorgente di Pages è «${tipo:-sconosciuta}»: per pubblicare da questo workflow imposta Settings → Pages → Source = GitHub Actions. Intanto resta in uso il deploy integrato di GitHub."
            echo "pubblica=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # a mano si pubblica sempre; altrimenti solo se il commit non è già online
          ultimo=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/deployments?environment=github-pages&per_page=1" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['sha'] if isinstance(d,list) and d else '')")
          if [ "$EVENTO" != "workflow_dispatch" ] && [ "$ultimo" = "$(git rev-parse HEAD)" ]; then
            echo "Il commit $(git rev-parse --short HEAD) è già online: niente da pubblicare."
            echo "pubblica=no" >> "$GITHUB_OUTPUT"
          else
            echo "pubblica=si" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/configure-pages@v5
        if: steps.controllo.outputs.pubblica == 'si'

      - uses: actions/upload-pages-artifact@v3
        if: steps.controllo.outputs.pubblica == 'si'
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.controllo.outputs.pubblica == 'si'
