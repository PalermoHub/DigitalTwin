name: Aggiorna incendi

# Avvio manuale: ri-scarica gli incendi del Comune di Palermo dal Censimento Incendi della Regione Siciliana
# (un layer per anno: i nuovi anni si scoprono da soli) e rigenera dati/incedi/ con il PMTiles a zoom 12-18.
on:
  workflow_dispatch:
    inputs:
      committa:
        description: "Salva i dati aggiornati nel repository (altrimenti solo artefatto scaricabile)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: aggiorna-incendi
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa shapely
        run: pip install shapely

      - name: Cache di tippecanoe
        id: cache-tippecanoe
        uses: actions/cache@v4
        with:
          path: ~/tippecanoe-bin
          key: tippecanoe-2.53.0-${{ runner.os }}

      - name: Compila tippecanoe
        if: steps.cache-tippecanoe.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev
          git clone --depth 1 --branch 2.53.0 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)"
          make -C /tmp/tippecanoe install PREFIX="$HOME/tippecanoe-bin"

      - name: Scarica gli incendi di Palermo e costruisci il PMTiles
        run: |
          export PATH="$HOME/tippecanoe-bin/bin:$PATH"
          python3 scripts/incendi.py

      - name: Riepilogo
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          d = json.load(open("dati/incedi/anni.json"))["anni"]
          print("## Incendi aggiornati")
          print(f"- Anni: {d[-1]['anno']}–{d[0]['anno']} · incendi a Palermo: {sum(a['n'] for a in d)} · PMTiles: {os.path.getsize('dati/incedi/incendi.pmtiles') / 1e6:.1f} MB")
          print("")
          print("| Anno | Incendi | Ettari |")
          print("|---|---|---|")
          for a in d:
              print(f"| {a['anno']} | {a['n']} | {a['ettari']} |")
          PY

      - name: Artefatto
        uses: actions/upload-artifact@v4
        with:
          name: dati-incendi
          path: dati/incedi/

      - name: Salva nel repository
        if: ${{ inputs.committa }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dati/incedi/
          if git diff --cached --quiet; then
            echo "Nessuna variazione nei dati."
          else
            git commit -m "dati: aggiornamento incendi ($(date -u +%F))"
            git push
          fi
