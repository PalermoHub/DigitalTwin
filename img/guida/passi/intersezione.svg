    .b{font-size:14px;fill:#d5dae0}
    .c{font-size:15px;font-weight:700;fill:#fff}
    .k{fill:#3a3f46;fill-opacity:.82;stroke:#8a9099;stroke-opacity:.55;stroke-width:1.2}
    .l{fill:none;stroke:#f5a623;stroke-linecap:round;stroke-linejoin:round}
    .g{stroke-width:9;stroke-opacity:.22}
    .f{stroke-width:3}
    .i{fill:none;stroke:#f5a623;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
    .st{fill:none;stroke:#555b63;stroke-opacity:.45;stroke-width:1}
  </style>
