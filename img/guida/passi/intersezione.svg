<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" role="img" aria-labelledby="t d">
  <title id="t">Tutto in un punto</title>
  <desc id="d">Un clic su via Maqueda 435 restituisce catasto, vincoli, sicurezza, cultura e trasporti: particella 180 foglio 128, zonizzazione PRG 2004 centro storico, zona a incidenti concentrati, chiesa delle Francescane non più esistente, trasporto pubblico a 130 metri.</desc>
